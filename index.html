<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wepeka Brandlab</title>
<meta name="description" content="Wepeka Brandlab — bangun brand dan sistem kontenmu dalam satu tempat: rencanakan, terbitkan, dan pahami konten yang berhasil." />
<!-- SEO: this is the signed-in app. The public, indexable page about
     Brandlab is www.wepeka.com/brandlab, so point crawlers and link
     previews there instead of letting two "Wepeka Brandlab" results compete. -->
<link rel="canonical" href="https://www.wepeka.com/brandlab" />
<meta name="robots" content="noindex, follow" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Wepeka" />
<meta property="og:locale" content="id_ID" />
<meta property="og:title" content="Wepeka Brandlab" />
<meta property="og:description" content="Bangun brand dan sistem kontenmu dalam satu tempat: rencanakan, terbitkan, dan pahami konten yang berhasil. Trial gratis 30 hari." />
<meta property="og:url" content="https://www.wepeka.com/brandlab" />
<meta property="og:image" content="https://www.wepeka.com/opengraph-image" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Wepeka Brandlab" />
<meta name="twitter:description" content="Bangun brand dan sistem kontenmu dalam satu tempat. Trial gratis 30 hari." />
<meta name="twitter:image" content="https://www.wepeka.com/opengraph-image" />
<meta name="theme-color" content="#0c0b0a" />
<link rel="icon" href="assets/wepeka-favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="assets/wepeka-apple-icon.png" />
<!-- Firebase's SDK modules (js/firebase.js) load from gstatic as CORS
     module requests: open that connection while the HTML is still parsing. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<!-- The two fonts every screen renders with immediately (body text +
     headings, css/styles.css's @font-face) — preloaded so the browser
     fetches them in parallel with the stylesheet instead of discovering
     them only after css/styles.css has downloaded and parsed. -->
<link rel="preload" as="font" type="font/woff" href="fonts/grift-black.woff" crossorigin>
<link rel="preload" as="font" type="font/woff" href="fonts/JUST Sans Regular.woff" crossorigin>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/campaign.css" />
<script>try{if(localStorage.getItem("wepeka-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<!-- Boot loader, painted with the first frame while the JS modules and
     Firebase load. Same markup as js/main.js showLoading(), which adopts
     this copy instead of re-rendering it. -->
<div id="app"><div class="wl-loader" role="status" aria-live="polite"><div class="wl-loader-sheet wl-loader-color"></div><div class="wl-loader-sheet wl-loader-dark"><div class="wl-loader-logo"><div class="wl-loader-mark"><img src="assets/wepeka-logo.png" alt="Wepeka" /><span class="wl-loader-divider"></span><span>Brandlab</span></div><span class="wl-loader-line"></span></div></div><span class="sr-only">Memuat…</span></div></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
